[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "social-data-crawler"
version = "0.3.0"
description = "Public social platform data crawler platform scaffold with Douyin APP UI collection support."
requires-python = ">=3.11"
dependencies = [
    "mitmproxy>=10.3.0",
    "uiautomator2>=3.2.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
]

[project.scripts]
douyin-crawler = "douyin_crawler.cli:app"
social-crawler = "social_crawler.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
